[profile.default]
# 並行実行数を制限（DB接続の競合回避）
test-threads = 4
# 失敗したテストを最初に実行
fail-fast = false
# テスト実行時間の上限
slow-timeout = { period = "120s" }
# テスト詳細出力
status-level = "all"

[profile.ci] 
# CI環境用プロファイル
test-threads = 2
fail-fast = true
slow-timeout = { period = "60s" }
status-level = "fail"

[profile.integration]
# 統合テスト用プロファイル
test-threads = 1  # DB操作の競合を完全回避
slow-timeout = { period = "300s" }
status-level = "all"

# テストグループ定義
[[profile.default.overrides]]
filter = "test(integration)"
slow-timeout = { period = "180s" }

[[profile.default.overrides]]
filter = "test(unit)"
slow-timeout = { period = "30s" }