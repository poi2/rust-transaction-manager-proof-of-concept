[package]
name = "test-sqlx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
derive-getters = "0.5.0"
getset = "0.1.6"
sqlx = { version = "0.8.6", features = [ "postgres", "runtime-tokio", "tls-native-tls", "uuid" ] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"]}
uuid = { version = "1.18.1", features = ["v4"] }